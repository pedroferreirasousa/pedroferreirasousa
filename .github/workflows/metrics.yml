name: GitHub Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Traz o total de commits, repositórios e atividade corporativa/privada
          repositories_affiliations: owner, collaborator, organization_member
          
          # Calendário 3D (Roda 100% perfeitamente)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # Desativa os plugins que dependem de leitura de bytes bloqueados por SSO
          plugin_languages: no
          plugin_habits: no
          
          config_timezone: America/Sao_Paulo
